[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "json-query-kit"
version = "0.1.1"
description = "零依赖 JSON 点分路径查询：下标/切片/[*] 通配、多命中带完整路径、CJK 键支持"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["json", "query", "jq", "点分路径"]

[project.scripts]
json-query = "json_query.__main__:main"

[tool.setuptools.packages.find]
include = ["json_query*"]
